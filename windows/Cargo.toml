[package]
name = "udp2cal"
version = "1.3.0"
edition = "2021"
description = "UDP2CAL - 局域网音频串流Windows接收端"
build = "build.rs"

[profile.release]
opt-level = 3   # 实时音频路径优先速度，体积换性能不划算
lto = true
codegen-units = 1
panic = "unwind"
strip = "symbols"

[build-dependencies]
winres = "0.1"
image = "0.24"

[dependencies]
udp2cal-protocol = { path = "../protocol" }
iced = { version = "0.14", default-features = false, features = ["tokio", "tiny-skia", "image"] }
tokio = { version = "1.40", features = ["net", "sync", "rt", "macros", "time"] }
cpal = "0.15"
windows = { version = "0.58", features = [
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
] }
winreg = "0.52"
audiopus = "0.3.0-rc.0"
tray-icon = "0.24.0"
image = "0.24"

# 共用仓库根目录的 opus-src 树（Android/Windows 同源），替代 crate 内置的 Opus 1.3.1
# audiopus 副本增加解码器 set_complexity 与编码器 set_dred_duration 扩展
[patch.crates-io]
audiopus_sys = { path = "../vendor/audiopus_sys" }
audiopus = { path = "../vendor/audiopus" }