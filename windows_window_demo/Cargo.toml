[package]
name = "windows-window-demo"
version = "0.1.0"
edition = "2021"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["tokio", "tiny-skia"] }
tray-icon = "0.24"
tokio = { version = "1.40", features = ["sync"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
